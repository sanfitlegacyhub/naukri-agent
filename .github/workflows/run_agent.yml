name: Naukri Daily Resume Update

on:
  schedule:
    - cron: '30 3 * * *'  # 9:00 AM IST daily
  workflow_dispatch:

jobs:
  update-resume:
    runs-on: self-hosted
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          pip3 install -r agent/requirements.txt

      - name: Run Resume Update Agent
        env:
          NAUKRI_EMAIL: ${{ secrets.NAUKRI_EMAIL }}
          NAUKRI_PASSWORD: ${{ secrets.NAUKRI_PASSWORD }}
          RESUME_PATH: resume/Santhosh_Devops_Engineer.pdf
        run: |
          python3 agent/naukri_agent.py
